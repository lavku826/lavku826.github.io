<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lavkush's Ultimate Tool Hub</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Courier New', monospace;
      background-color: black;
      color: #00ff00;
      overflow-x: hidden;
    }
    header {
      background-color: #111;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #0f0;
    }
    header h1 {
      font-size: 2.5rem;
      letter-spacing: 2px;
    }
    .tool-section {
      margin: 40px;
      padding: 20px;
      background-color: #111;
      border: 1px solid #0f0;
      border-radius: 8px;
    }
    .tool-section h2 {
      margin-bottom: 10px;
    }
    input, button {
      padding: 8px;
      margin: 5px 0;
      background-color: #222;
      border: 1px solid #0f0;
      color: #0f0;
    }
    .output {
      margin-top: 10px;
      font-weight: bold;
      color: #ff0;
    }
  </style>
</head>
<body><header>
  <h1>Lavkush's Ultimate Tool Hub</h1>
</header><div class="tool-section">
  <h2>🔐 Password Generator</h2>
  <label>Password Length: <input type="number" id="length" min="4" max="32" value="12"></label><br>
  <label><input type="checkbox" id="lowercase" checked> Include Lowercase</label><br>
  <label><input type="checkbox" id="uppercase" checked> Include Uppercase</label><br>
  <label><input type="checkbox" id="numbers" checked> Include Numbers</label><br>
  <label><input type="checkbox" id="symbols"> Include Symbols</label><br>
  <button onclick="generatePassword()">Generate Password</button>
  <div class="output" id="passwordResult"></div>
</div>
<div class="tool-section" id="ip-finder">
  <h2>🌐 IP Address Finder</h2>
  <button onclick="getIP()">Find My IP Address</button>
  <p id="ipResult">Your IP will appear here...</p>
</div>
<div class="tool-section" id="binary-converter">
  <h2>🧠 Binary ↔ Text Converter</h2>

  <label for="binaryInput">Enter Binary or Text:</label><br>
  <textarea id="binaryInput" rows="4" cols="50"></textarea><br><br>

  <button onclick="binaryToText()">Convert to Text</button>
  <button onclick="textToBinary()">Convert to Binary</button><br><br>

  <label for="outputResult">Result:</label><br>
  <textarea id="outputResult" rows="4" cols="50" readonly></textarea>
</div>
<div class="tool-section" id="text-diff-checker">
  <h2>📄 Text Difference Checker</h2>
  <textarea id="text1" rows="6" cols="50" placeholder="Enter original text here..."></textarea><br><br>
  <textarea id="text2" rows="6" cols="50" placeholder="Enter modified text here..."></textarea><br><br>
  <button onclick="checkDifference()">Check Difference</button>
  <pre id="diffResult" style="white-space: pre-wrap; margin-top: 10px;"></pre>
</div>
<div class="tool-section" id="mobile-number-finder">
  <h2>📱 Mobile Number Series Finder</h2>
  <input type="text" id="mobileInput" placeholder="Enter 10-digit mobile number" maxlength="10">
  <button onclick="findMobileInfo()">Find Info</button>
  <p id="mobileResult"></p>
</div>

<script>
  const mobileDatabase = {
    '98': { provider: 'Airtel', circle: 'Delhi' },
    '99': { provider: 'Vodafone Idea', circle: 'Maharashtra' },
    '97': { provider: 'Jio', circle: 'UP East' },
    '96': { provider: 'BSNL', circle: 'Kerala' },
    '95': { provider: 'Jio', circle: 'Bihar' },
    '94': { provider: 'Airtel', circle: 'Tamil Nadu' },
    '93': { provider: 'Vodafone', circle: 'West Bengal' },
    '92': { provider: 'Idea', circle: 'MP & Chhattisgarh' },
    '91': { provider: 'Jio', circle: 'Gujarat' },
    '90': { provider: 'Airtel', circle: 'Haryana' },
  };

  function findMobileInfo() {
    const number = document.getElementById('mobileInput').value;
    const result = document.getElementById('mobileResult');

    if (!/^[6-9]\\d{9}$/.test(number)) {
      result.textContent = '❌ Please enter a valid 10-digit Indian mobile number.';
      return;
    }

    const prefix = number.substring(0, 2);
    const info = mobileDatabase[prefix];

    if (info) {
      result.innerHTML = `✅ Network: <b>${info.provider}</b><br>📍 Circle: <b>${info.circle}</b>`;
    } else {
      result.textContent = '❌ Info not found for this number series.';
    }
  }
</script>
<script>
function checkDifference() {
  const text1 = document.getElementById('text1').value.split('\\n');
  const text2 = document.getElementById('text2').value.split('\\n');
  let result = '';
  for (let i = 0; i < Math.max(text1.length, text2.length); i++) {
    const t1 = text1[i] || '';
    const t2 = text2[i] || '';
    if (t1 !== t2) {
      result += `🔻 Line ${i+1} changed:\\n- Original: ${t1}\\n+ Updated: ${t2}\\n\\n`;
    }
  }
  if (result === '') {
    result = '✅ No differences found.';
  }
  document.getElementById('diffResult').innerText = result;
}
</script>
<script>
function binaryToText() {
  const binaryStr = document.getElementById('binaryInput').value.trim();
  const binaryArr = binaryStr.split(' ');
  let text = '';
  for (let i = 0; i < binaryArr.length; i++) {
    const charCode = parseInt(binaryArr[i], 2);
    if (!isNaN(charCode)) {
      text += String.fromCharCode(charCode);
    }
  }
  document.getElementById('outputResult').value = text;
}

function textToBinary() {
  const text = document.getElementById('binaryInput').value;
  let binary = '';
  for (let i = 0; i < text.length; i++) {
    binary += text[i].charCodeAt(0).toString(2) + ' ';
  }
  document.getElementById('outputResult').value = binary.trim();
}
</script>
<script>
  function getIP() {
    fetch('https://api.ipify.org?format=json')
      .then(response => response.json())
      .then(data => {
        document.getElementById('ipResult').innerText = `🔎 Your IP Address is: ${data.ip}`;
      })
      .catch(error => {
        document.getElementById('ipResult').innerText = '⚠️ Unable to fetch IP address.';
        console.error(error);
      });
  }
</script>
<script>
  function generatePassword() {
    const length = parseInt(document.getElementById("length").value);
    const useLower = document.getElementById("lowercase").checked;
    const useUpper = document.getElementById("uppercase").checked;
    const useNumber = document.getElementById("numbers").checked;
    const useSymbol = document.getElementById("symbols").checked;

    const lower = "abcdefghijklmnopqrstuvwxyz";
    const upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const numbers = "0123456789";
    const symbols = "!@#$%^&*()_+{}[]<>?/|";

    let allChars = "";
    if (useLower) allChars += lower;
    if (useUpper) allChars += upper;
    if (useNumber) allChars += numbers;
    if (useSymbol) allChars += symbols;

    if (allChars.length === 0) {
      document.getElementById("passwordResult").innerText = "❗ Please select at least one option.";
      return;
    }

    let password = "";
    for (let i = 0; i < length; i++) {
      const randomIndex = Math.floor(Math.random() * allChars.length);
      password += allChars[randomIndex];
    }

    document.getElementById("passwordResult").innerText = `🔑 ${password}`;
  }
</script></body>
</html>
