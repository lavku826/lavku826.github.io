<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lavkush's Tools Hub</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    header {
      background: #222;
      color: white;
      padding: 20px;
      text-align: center;
    }
    h1 {
      margin: 0;
    }
    .intro {
      padding: 20px;
      background: #fff;
      text-align: center;
    }
    .tool-section {
      margin: 20px;
      padding: 20px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    footer {
      background: #222;
      color: red;
      text-align: center;
      padding: 10px;
    }
  </style>
</head>
<body>

<header>
  <h1>Lavkush's Free Online Tools</h1>
</header>

<div class="intro">
  <p>Welcome! Explore useful tools made by Lavkush. More tools added regularly.</p>
</div>

<!-- TOOL SECTION START -->

<div class="tool-section">
  <h2>🔐 Password Generator</h2>
  <label for="length">Password Length:</label>
  <input type="number" id="length" min="4" max="32" value="12"><br><br>

  <label><input type="checkbox" id="lowercase" checked> Include Lowercase</label><br>
  <label><input type="checkbox" id="uppercase" checked> Include Uppercase</label><br>
  <label><input type="checkbox" id="numbers" checked> Include Numbers</label><br>
  <label><input type="checkbox" id="symbols"> Include Symbols</label><br><br>

  <button onclick="generatePassword()">Generate Password</button>
  <p id="passwordResult" style="word-wrap: break-word;"></p>
</div>

<div class="tool-section" id="currency-converter">
  <h2>Currency Converter</h2>
  <p>This section will have a currency converter or other tools you add later.</p>
</div>

<!-- TOOL SECTION END -->

<footer>
  <p>&copy; 2025 Lavkush Chaudhary. All Rights Reserved.</p>
</footer>

<!-- ✅ JavaScript Yahan Likho -->
<script>
  function generatePassword() {
    const length = parseInt(document.getElementById("length").value);
    const useLower = document.getElementById("lowercase").checked;
    const useUpper = document.getElementById("uppercase").checked;
    const useNumber = document.getElementById("numbers").checked;
    const useSymbol = document.getElementById("symbols").checked;

    const lower = "abcdefghijklmnopqrstuvwxyz";
    const upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const numbers = "0123456789";
    const symbols = "!@#$%^&*()_+{}[]<>?/|";

    let allChars = "";
    if (useLower) allChars += lower;
    if (useUpper) allChars += upper;
    if (useNumber) allChars += numbers;
    if (useSymbol) allChars += symbols;

    if (allChars.length === 0) {
      document.getElementById("passwordResult").innerText = "❗ Please select at least one option.";
      return;
    }

    let password = "";
    for (let i = 0; i < length; i++) {
      const randomIndex = Math.floor(Math.random() * allChars.length);
      password += allChars[randomIndex];
    }

    document.getElementById("passwordResult").innerText = `🔑 ${password}`;
  }
</script>

</body>
</html>
