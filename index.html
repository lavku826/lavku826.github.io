<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lavkush's Ultimate Tool Hub</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Courier New', monospace;
      background-color: black;
      color: #00ff00;
      overflow-x: hidden;
    }
    header {
      background-color: #111;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #0f0;
    }
    header h1 {
      font-size: 2.5rem;
      letter-spacing: 2px;
    }
    .tool-section {
      margin: 40px;
      padding: 20px;
      background-color: #111;
      border: 1px solid #0f0;
      border-radius: 8px;
    }
    .tool-section h2 {
      margin-bottom: 10px;
    }
    input, button {
      padding: 8px;
      margin: 5px 0;
      background-color: #222;
      border: 1px solid #0f0;
      color: #0f0;
    }
    .output {
      margin-top: 10px;
      font-weight: bold;
      color: #ff0;
    }
  </style>
</head>
<body><header>
  <h1>Lavkush's Ultimate Tool Hub</h1>
</header><div class="tool-section">
  <h2>🔐 Password Generator</h2>
  <label>Password Length: <input type="number" id="length" min="4" max="32" value="12"></label><br>
  <label><input type="checkbox" id="lowercase" checked> Include Lowercase</label><br>
  <label><input type="checkbox" id="uppercase" checked> Include Uppercase</label><br>
  <label><input type="checkbox" id="numbers" checked> Include Numbers</label><br>
  <label><input type="checkbox" id="symbols"> Include Symbols</label><br>
  <button onclick="generatePassword()">Generate Password</button>
  <div class="output" id="passwordResult"></div>
</div>
<div class="tool-section" id="ip-finder">
  <h2>🌐 IP Address Finder</h2>
  <button onclick="getIP()">Find My IP Address</button>
  <p id="ipResult">Your IP will appear here...</p>
</div>

<script>
  function getIP() {
    fetch('https://api.ipify.org?format=json')
      .then(response => response.json())
      .then(data => {
        document.getElementById('ipResult').innerText = `🔎 Your IP Address is: ${data.ip}`;
      })
      .catch(error => {
        document.getElementById('ipResult').innerText = '⚠️ Unable to fetch IP address.';
        console.error(error);
      });
  }
</script>
<script>
  function generatePassword() {
    const length = parseInt(document.getElementById("length").value);
    const useLower = document.getElementById("lowercase").checked;
    const useUpper = document.getElementById("uppercase").checked;
    const useNumber = document.getElementById("numbers").checked;
    const useSymbol = document.getElementById("symbols").checked;

    const lower = "abcdefghijklmnopqrstuvwxyz";
    const upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const numbers = "0123456789";
    const symbols = "!@#$%^&*()_+{}[]<>?/|";

    let allChars = "";
    if (useLower) allChars += lower;
    if (useUpper) allChars += upper;
    if (useNumber) allChars += numbers;
    if (useSymbol) allChars += symbols;

    if (allChars.length === 0) {
      document.getElementById("passwordResult").innerText = "❗ Please select at least one option.";
      return;
    }

    let password = "";
    for (let i = 0; i < length; i++) {
      const randomIndex = Math.floor(Math.random() * allChars.length);
      password += allChars[randomIndex];
    }

    document.getElementById("passwordResult").innerText = `🔑 ${password}`;
  }
</script></body>
</html>
